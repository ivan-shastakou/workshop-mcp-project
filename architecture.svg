<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .name { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .sub { font-size: 12px; fill: #334155; }
      .small { font-size: 11px; fill: #475569; }
      .edge { font-size: 11px; fill: #334155; }
      .key { font-size: 11px; fill: #b45309; }
      .ui { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
      .svc { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .db { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .ext { fill: #f3e8ff; stroke: #9333ea; stroke-width: 1.5; }
      .user { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
      .line { stroke: #475569; stroke-width: 1.5; fill: none; }
      .jwks { stroke: #b45309; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    </style>
  </defs>

  <rect width="1400" height="700" fill="#ffffff"/>
  <text x="30" y="40" class="title">Room booking platform: services and databases</text>

  <!-- Compose profiles -->
  <rect x="30" y="130" width="1050" height="470" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="45" y="152" class="small">Docker Compose profile <tspan font-weight="700">full</tspan> (everything)</text>
  <rect x="405" y="145" width="660" height="440" rx="12" fill="#f8fafc" fill-opacity="0.6" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="1050" y="167" class="small" text-anchor="end">profile <tspan font-weight="700">chat</tspan> (AI chat only)</text>

  <!-- Browser -->
  <rect x="440" y="58" width="220" height="48" rx="24" class="user"/>
  <text x="550" y="87" class="name" text-anchor="middle">Browser (user)</text>

  <!-- UIs -->
  <rect x="110" y="180" width="260" height="70" rx="10" class="ui"/>
  <text x="240" y="205" class="name" text-anchor="middle">frontend  :3000</text>
  <text x="240" y="223" class="sub" text-anchor="middle">Booking UI: React + FullCalendar</text>
  <text x="240" y="240" class="small" text-anchor="middle">nginx, chat panel + 🔌 MCP</text>

  <rect x="660" y="180" width="260" height="70" rx="10" class="ui"/>
  <text x="790" y="205" class="name" text-anchor="middle">chat-ui  :3001</text>
  <text x="790" y="223" class="sub" text-anchor="middle">Standalone chat UI: React</text>
  <text x="790" y="240" class="small" text-anchor="middle">nginx, 🔌 MCP</text>

  <!-- Services -->
  <rect x="60" y="330" width="240" height="80" rx="10" class="svc"/>
  <text x="180" y="356" class="name" text-anchor="middle">backend  :8080</text>
  <text x="180" y="375" class="sub" text-anchor="middle">Booking REST API</text>
  <text x="180" y="393" class="small" text-anchor="middle">Spring Boot 4.1, JPA, Flyway</text>

  <rect x="430" y="330" width="240" height="80" rx="10" class="svc"/>
  <text x="550" y="356" class="name" text-anchor="middle">auth-service  :8081</text>
  <text x="550" y="375" class="sub" text-anchor="middle">Register / login, issues RS256 JWT</text>
  <text x="550" y="393" class="small" text-anchor="middle">JWKS: /.well-known/jwks.json</text>

  <rect x="800" y="330" width="240" height="80" rx="10" class="svc"/>
  <text x="920" y="356" class="name" text-anchor="middle">chat-service  :8082</text>
  <text x="920" y="375" class="sub" text-anchor="middle">Spring AI 2.0: ChatClient, SSE</text>
  <text x="920" y="393" class="small" text-anchor="middle">chat memory, runtime MCP clients</text>

  <!-- Databases (cylinders) -->
  <g>
    <path d="M80,492 v58 a100,12 0 0,0 200,0 v-58" class="db"/>
    <ellipse cx="180" cy="492" rx="100" ry="12" class="db"/>
    <text x="180" y="525" class="name" text-anchor="middle">postgres  :5432</text>
    <text x="180" y="543" class="small" text-anchor="middle">db roombooking: room, booking</text>
  </g>
  <g>
    <path d="M450,492 v58 a100,12 0 0,0 200,0 v-58" class="db"/>
    <ellipse cx="550" cy="492" rx="100" ry="12" class="db"/>
    <text x="550" y="525" class="name" text-anchor="middle">auth-db  :5433</text>
    <text x="550" y="543" class="small" text-anchor="middle">db auth: app_user, signing_key</text>
  </g>
  <g>
    <path d="M820,492 v72 a100,12 0 0,0 200,0 v-72" class="db"/>
    <ellipse cx="920" cy="492" rx="100" ry="12" class="db"/>
    <text x="920" y="525" class="name" text-anchor="middle">chat-db  :5434</text>
    <text x="920" y="543" class="small" text-anchor="middle">db chat: spring_ai_chat_memory,</text>
    <text x="920" y="558" class="small" text-anchor="middle">mcp_server (encrypted headers)</text>
  </g>

  <!-- External -->
  <text x="1240" y="260" class="small" text-anchor="middle" font-weight="700">External (internet)</text>
  <rect x="1130" y="275" width="220" height="64" rx="10" class="ext"/>
  <text x="1240" y="300" class="name" text-anchor="middle">Google Gemini API</text>
  <text x="1240" y="320" class="small" text-anchor="middle">GEMINI_MODEL, GEMINI_API_KEY</text>

  <rect x="1130" y="400" width="220" height="64" rx="10" class="ext"/>
  <text x="1240" y="425" class="name" text-anchor="middle">Remote MCP servers</text>
  <text x="1240" y="445" class="small" text-anchor="middle">https only, e.g. DeepWiki</text>

  <!-- Browser to UIs -->
  <path d="M500,106 L270,178" class="line" marker-end="url(#arrow)"/>
  <path d="M600,106 L760,178" class="line" marker-end="url(#arrow)"/>

  <!-- frontend nginx routes -->
  <path d="M200,250 L185,328" class="line" marker-end="url(#arrow)"/>
  <text x="120" y="292" class="edge">/api/*</text>
  <path d="M280,250 L500,328" class="line" marker-end="url(#arrow)"/>
  <text x="360" y="312" class="edge">/api/auth</text>
  <path d="M340,250 C520,285 760,290 860,328" class="line" marker-end="url(#arrow)"/>
  <text x="520" y="266" class="edge">/api/chat, /api/mcp</text>

  <!-- chat-ui nginx routes -->
  <path d="M740,250 L610,328" class="line" marker-end="url(#arrow)"/>
  <text x="640" y="318" class="edge">/api/auth</text>
  <path d="M840,250 L900,328" class="line" marker-end="url(#arrow)"/>
  <text x="880" y="280" class="edge">/api/chat, /api/mcp</text>

  <!-- JWT verification -->
  <path d="M300,370 L428,370" class="jwks" marker-end="url(#arrow-key)"/>
  <text x="364" y="362" class="key" text-anchor="middle">JWKS</text>
  <path d="M800,370 L672,370" class="jwks" marker-end="url(#arrow-key)"/>
  <text x="736" y="362" class="key" text-anchor="middle">JWKS</text>

  <!-- Services to databases -->
  <path d="M180,410 L180,478" class="line" marker-end="url(#arrow)"/>
  <path d="M550,410 L550,478" class="line" marker-end="url(#arrow)"/>
  <path d="M920,410 L920,478" class="line" marker-end="url(#arrow)"/>
  <text x="188" y="448" class="edge">JDBC</text>
  <text x="558" y="448" class="edge">JDBC</text>
  <text x="928" y="448" class="edge">JDBC</text>

  <!-- chat-service to external -->
  <path d="M1040,350 L1128,312" class="line" marker-end="url(#arrow)"/>
  <text x="1086" y="300" class="edge">HTTPS</text>
  <path d="M1040,392 L1128,428" class="line" marker-end="url(#arrow)"/>
  <text x="1086" y="440" class="edge">MCP</text>

  <!-- Legend -->
  <g transform="translate(30,630)">
    <path d="M0,8 L40,8" class="line" marker-end="url(#arrow)"/>
    <text x="50" y="12" class="small">HTTP request (nginx proxy route) / JDBC</text>
    <path d="M300,8 L340,8" class="jwks" marker-end="url(#arrow-key)"/>
    <text x="350" y="12" class="small">JWT verification: public keys fetched from auth-service; passwords never leave it</text>
    <rect x="0" y="30" width="16" height="12" class="ui"/><text x="22" y="40" class="small">UI (nginx)</text>
    <rect x="110" y="30" width="16" height="12" class="svc"/><text x="132" y="40" class="small">Spring Boot service</text>
    <rect x="270" y="30" width="16" height="12" class="db"/><text x="292" y="40" class="small">PostgreSQL 18 (one per service)</text>
    <rect x="490" y="30" width="16" height="12" class="ext"/><text x="512" y="40" class="small">External</text>
  </g>
</svg>
