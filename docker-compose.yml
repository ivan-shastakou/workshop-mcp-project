# Run modes (Docker Compose profiles):
#   full - everything: booking UI + backend, auth, AI chat and the standalone chat UI (default, see COMPOSE_PROFILES in .env)
#   chat - only the AI chat: chat UI, chat-service, auth-service and their databases
#
#   docker compose up -d                          -> full
#   docker compose --profile chat up -d           -> chat only
#   docker compose down                           -> stops whatever is running
services:
  postgres:
    profiles: [full]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: roombooking
      POSTGRES_USER: roombooking
      POSTGRES_PASSWORD: roombooking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roombooking -d roombooking"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-db:
    profiles: [full, chat]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    ports:
      - "5433:5432"
    volumes:
      - authdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    profiles: [full, chat]
    build: ./auth-service
    environment:
      DB_URL: jdbc:postgresql://auth-db:5432/auth
      DB_USERNAME: auth
      DB_PASSWORD: auth
      JWT_ISSUER: room-booking-auth
      JWT_TTL: 8h
    ports:
      - "8081:8081"
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  backend:
    profiles: [full]
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/roombooking
      DB_USERNAME: roombooking
      DB_PASSWORD: roombooking
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      JWT_ISSUER: room-booking-auth
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  chat-db:
    profiles: [full, chat]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports:
      - "5434:5432"
    volumes:
      - chatdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  chat-service:
    profiles: [full, chat]
    build: ./chat-service
    environment:
      DB_URL: jdbc:postgresql://chat-db:5432/chat
      DB_USERNAME: chat
      DB_PASSWORD: chat
      AUTH_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      JWT_ISSUER: room-booking-auth
    ports:
      - "8082:8082"
    depends_on:
      chat-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    profiles: [full]
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy

  chat-ui:
    profiles: [full, chat]
    build: ./chat-ui
    ports:
      - "3001:80"
    depends_on:
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy

volumes:
  pgdata:
  authdata:
  chatdata:
