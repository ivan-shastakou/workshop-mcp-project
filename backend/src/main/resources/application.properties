spring.application.name=room-booking

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/roombooking}
spring.datasource.username=${DB_USERNAME:roombooking}
spring.datasource.password=${DB_PASSWORD:roombooking}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

# Tokens are issued by auth-service; verified here with its public keys
auth.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
auth.jwt.issuer=${JWT_ISSUER:room-booking-auth}

# --- MCP server: booking tools for AI clients (chat-service, MCP Inspector, IDEs) ---
# Same app, port and JWT security as the REST API; the tools reuse RoomService and BookingService.
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=room-booking
spring.ai.mcp.server.version=1.0.0
# Streamable HTTP on a single endpoint; the older SSE transport is not needed
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
# Sent to clients on initialize; models read it as a hint on how to use the tools
spring.ai.mcp.server.instructions=Meeting room bookings of the office. Times are ISO-8601 with an offset, \
  e.g. 2026-10-23T10:00:00+02:00. Check free rooms before creating a booking. \
  The authenticated user is the organizer of the bookings they create.

management.endpoints.web.exposure.include=health,info
